{% extends "base.html" %}

{% block title %}Internal Server Error (500) - Hebron Enterprises{% endblock %}

{% block content %}
<div class="container container-lg my-5 py-5">
    <div class="row justify-content-center text-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="mb-4 text-danger">
                    <i class="bi bi-exclamation-triangle-fill display-1" style="font-size: 5rem; opacity: 0.9;"></i>
                    <h1 class="display-3 fw-bold text-dark mt-3 mb-0">500</h1>
                </div>
                
                <h3 class="fw-bold text-dark mb-3">Server Error</h3>
                <p class="text-muted mb-4">
                    An unexpected server error occurred. Please try refreshing the page or check back in a few minutes.
                </p>

                <div class="d-flex flex-wrap gap-2 justify-content-center">
                    <a href="{{ url_for('home') }}" class="btn btn-theme-primary px-4 py-2">
                        <i class="bi bi-house-door-fill me-2"></i>Return to Home
                    </a>
                    <a href="{{ url_for('contact') }}" class="btn btn-theme-outline px-4 py-2">
                        <i class="bi bi-headset me-2"></i>Support / Contact
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
